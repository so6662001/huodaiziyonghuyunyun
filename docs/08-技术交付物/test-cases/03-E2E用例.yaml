# E2E（端到端）业务流程用例
# 工具建议：Playwright / Cypress
# 命名：E2E-{编号}-{业务名}

suite: "货袋子 E2E 测试"
version: "v2.0"

base_url:
  buyer: "https://staging.huodaizi.com/buyer"
  seller: "https://staging.huodaizi.com/seller"
  wechat_miniprogram: "wxapp://miniprogram"

# ============================================================
# E2E-01: 新买家完整首单流程
# ============================================================
- id: E2E-01
  name: "新买家完整首单流程"
  priority: P0
  description: |
    从注册到首次成交的完整流程，验证 M1+M2+M5+M6 联动。
  preconditions:
    - 测试买家手机号未注册
    - 平台至少 5 家活跃卖家在天津地区
  steps:
    - step: 1
      action: "打开微信小程序"
      verify: "看到主页 + 微信一键登录按钮"

    - step: 2
      action: "点击微信一键登录"
      verify: "完成登录，进入主页"

    - step: 3
      action: "上传营业执照（OCR 识别）"
      verify:
        - "OCR 识别耗时 < 10 秒"
        - "公司名/法人/地址自动填充"
        - "确认后进入'认证完成'状态"

    - step: 4
      action: "点击'发需求'，填写并提交"
      data:
        product: "热轧卷板"
        material: "Q235B"
        spec: "5.5×1500×C"
        quantity: 50
        delivery_city: "天津"
      verify:
        - "总耗时 < 60 秒"
        - "提交后跳转到采购会话页"
        - "聚合看板显示'匹配中...'"

    - step: 5
      action: "等待 30 分钟"
      verify:
        - "至少收到 3 家卖家报价"
        - "Top 3 报价以卡片形式展示"
        - "不显示卖家真名（盲价）"

    - step: 6
      action: "点击 Top 1 卖家'一键联系'"
      verify:
        - "进入 IM 会话"
        - "虚拟号通话按钮可用"
        - "卖家信用分/历史成交可见"

    - step: 7
      action: "在 IM 中说'我要 80 吨'"
      verify:
        - "AI 识变弹出确认条"
        - "AI 识别准确：数量 50 → 80"
        - "点击确认后卡片更新"

    - step: 8
      action: "等待所有卖家响应变更"
      verify:
        - "30 分钟内 ≥ 2 家更新报价"
        - "新报价含阶梯定价（80 吨档位）"

    - step: 9
      action: "选择'方案 A'，回填成交"
      data:
        deal_amount: 340800
      verify:
        - "成交回填成功"
        - "信用分 +10（首次成交）"
        - "进入'优质池'"
        - "试单激励 ¥200 运费券到账"

# ============================================================
# E2E-02: 清单采购完整流程
# ============================================================
- id: E2E-02
  name: "清单采购完整流程（货袋子杀手锏）"
  priority: P0
  description: |
    验证 M3 清单原生支持 → 拆单 → 多家应答 → 最优组合 → 选方案。
  preconditions:
    - 已登录买家账号
    - 平台至少 30 家活跃卖家
  steps:
    - step: 1
      action: "进入'清单采购'页面"

    - step: 2
      action: "拍照上传清单"
      data:
        file: "test_data/list_engineering_23rows.jpg"
      verify:
        - "上传成功，进入解析中状态"

    - step: 3
      action: "等待 AI 解析"
      verify:
        - "解析耗时 ≤ 15 秒"
        - "识别 23 行"
        - "整体置信度 ≥ 90%"

    - step: 4
      action: "查看 AI 确认页"
      verify:
        - "21 行高置信度直接展示"
        - "2 行不确定高亮在顶部"
        - "钢贸黑话正确识别（如'螺18 20T' → 螺纹 ¢18 20 吨）"

    - step: 5
      action: "点击'全部正确，发起询价'"
      verify:
        - "确认耗时 < 30 秒"
        - "进入'询价中'状态"

    - step: 6
      action: "查看智能拆单"
      verify:
        - "板材类拆出 ≥ 5 行，分配板材卖家"
        - "型材类拆出 ≥ 3 行，分配型材卖家"
        - "螺纹类拆出 ≥ 3 行，分配螺纹卖家"

    - step: 7
      action: "等待 60 分钟卖家应答"
      verify:
        - "至少 6 家卖家应答"
        - "至少 20 行有报价"

    - step: 8
      action: "查看最优组合方案"
      verify:
        - "4 种方案可见：成本最低/管理省事/最快/信用最高"
        - "方案 A（最低成本）显示合理价格"
        - "方案 B（一家通包）价格高于方案 A"

    - step: 9
      action: "选择方案 A，导出比价单 PDF"
      verify:
        - "PDF 生成成功"
        - "包含 23 行 × 6 家卖家对比表"
        - "包含'平台认证印章'"

# ============================================================
# E2E-03: 卖家完整接单流程
# ============================================================
- id: E2E-03
  name: "卖家完整接单流程"
  priority: P0
  description: |
    验证 M5 卖家偏好 → 收到派单 → 报价 → 变更响应 → 成交。
  preconditions:
    - 卖家已入驻并完成认证
    - 卖家设置接单偏好：接受标准+优质池，专精热轧
  steps:
    - step: 1
      action: "买家在天津发起热轧需求"

    - step: 2
      action: "等待卖家收到推送"
      verify:
        - "30 秒内收到 App push"
        - "如未读，2 分钟内收到短信"
        - "5 分钟内收到企微通知"

    - step: 3
      action: "卖家点击接单"
      verify:
        - "进入买家信息页"
        - "买家池子标签可见（优质池=金色）"
        - "买家信用分/历史可见"

    - step: 4
      action: "卖家填写报价（6 维方案）"
      data:
        base_price: 4280
        tier_pricing: [{50: 4280}, {80: 4260}, {100: 4240}]
        spec_adjustments: [{6mm: -60}, {8mm: -100}]
        add_ons:
          include_freight: 150
          urgent: 200
      verify:
        - "利润保护提示显示市场参考价"
        - "提示利润率（约 1.8%）"
        - "若低于底线会警告"

    - step: 5
      action: "提交报价"
      verify:
        - "报价提交成功"
        - "卖家收到'已报价'状态"

    - step: 6
      action: "买家变更需求（数量 50 → 80）"

    - step: 7
      action: "卖家收到变更通知"
      verify:
        - "App + 企微双通道收到"
        - "提示'买家变更数量为 80 吨'"
        - "可选'维持/调整/退出'"

    - step: 8
      action: "卖家点击'维持 ¥4280'"
      verify:
        - "新版本报价创建"
        - "card_version = 2"
        - "买家端实时看到更新"

    - step: 9
      action: "等待买家确认+成交回填"
      verify:
        - "卖家收到'成交'通知"
        - "信用分 +3"
        - "进入卖家私域 CRM"

# ============================================================
# E2E-04: 微信端发需求 + 跨端同步
# ============================================================
- id: E2E-04
  name: "微信端发需求 + 跨端同步"
  priority: P1
  description: |
    验证 M9 微信集成 + 跨端数据一致性。
  steps:
    - step: 1
      action: "买家在企微群里 @ 货袋子小助手"
      message: "@货袋子 我要 50 吨热轧 Q235B 5.5 到天津"
      verify:
        - "机器人 5 秒内回复"
        - "已发起采购会话 ps_xxxxxx"

    - step: 2
      action: "买家点击小程序卡片查看"
      verify:
        - "进入小程序"
        - "聚合看板已显示需求卡片"
        - "派单中状态"

    - step: 3
      action: "10 分钟后买家在 PC 端登录"
      verify:
        - "PC Web 上看到同样的会话"
        - "数据完全一致"

    - step: 4
      action: "在 PC 端修改需求数量"
      verify:
        - "微信端 5 秒内收到推送"
        - "卡片同步更新"

# ============================================================
# E2E-05: 风控触发 + 申诉 + 委员会复审
# ============================================================
- id: E2E-05
  name: "风控触发 → 申诉 → 委员会复审"
  priority: P1
  description: |
    验证 M11 风控完整闭环。
  preconditions:
    - 卖家信用 A 级
    - 卖家委员会已成立
  steps:
    - step: 1
      action: "卖家报价低于市场参考价 18%（触发 R023）"
      verify:
        - "报价默认隐藏"
        - "卖家收到警告"
        - "信用分扣 5"

    - step: 2
      action: "卖家点击'申诉'"
      data:
        reason: "我有真实库存，市场价不准"
        evidence: ["库存照片 URL"]
      verify:
        - "申诉提交成功"
        - "状态 = submitted"
        - "客服 4h 内响应"

    - step: 3
      action: "等待 24h 初步结论"
      verify:
        - "状态 = first_decision"
        - "卖家收到结论通知"

    - step: 4
      action: "卖家不满意，申请委员会复审"
      verify:
        - "状态 = appeal_committee"
        - "委员会 72h 内审议"

    - step: 5
      action: "委员会 14 票通过卖家立场"
      verify:
        - "信用分恢复"
        - "卖家收到通知 + 公开道歉"
        - "原 R023 规则进入评议（是否调整阈值）"

# ============================================================
# E2E-06: 反向邀请完整链路
# ============================================================
- id: E2E-06
  name: "卖家邀请买家 → 5 个里程碑 → 奖励发放"
  priority: P1
  description: |
    验证 M7 反向邀请完整 ROI 闭环 + 反作弊。
  steps:
    - step: 1
      action: "卖家在'我的邀请'生成二维码"
      verify:
        - "短链生成成功"
        - "落地页含卖家个人介绍"

    - step: 2
      action: "新买家扫码注册"
      verify:
        - "M1 注册奖励：卖家 ¥30 + 买家 ¥50 运费券"
        - "反作弊检查通过（不同设备/IP/营业执照）"

    - step: 3
      action: "新买家 7 日内发需求"
      verify:
        - "M2 奖励：卖家 ¥50 + 买家 ¥30 积分"

    - step: 4
      action: "新买家联系卖家 ≥3 次"
      verify:
        - "M3 奖励：卖家 ¥100"

    - step: 5
      action: "新买家 30 天内首单成交 ≥¥5 万"
      verify:
        - "M4 奖励：卖家 ¥300 + 买家 ¥200"

    - step: 6
      action: "新买家次月仍活跃"
      verify:
        - "M5 奖励：卖家 ¥200/月，连续 3 个月"

    - step: 7
      action: "卖家累计奖励 ≥¥1080，申请提现"
      verify:
        - "提现到对应营业执照法人账户"
        - "财务审核通过"

# ============================================================
# E2E-07: 区域风险预警 → 危机处理
# ============================================================
- id: E2E-07
  name: "区域卖家联盟抵制信号 → 处置闭环"
  priority: P0（致命）
  description: |
    验证 M11 区域监控 → 卖家委员会 → CEO 介入。
  steps:
    - step: 1
      action: "模拟事件：天津区域卖家响应率突降 22%/周"
      verify:
        - "监控系统触发红色预警"
        - "CEO + 运营负责人 4h 内收到通知"

    - step: 2
      action: "运营总监紧急会议"
      verify:
        - "数据复盘报告 24h 内出"
        - "确定根本原因（如：某新规则刺痛卖家）"

    - step: 3
      action: "CEO 拜访 30 家天津重点卖家"
      verify:
        - "拜访记录留痕"
        - "卖家反馈结构化记录"

    - step: 4
      action: "整改方案出炉"
      verify:
        - "48h 内出方案"
        - "明确暂停哪些规则、退还哪些会员费"

    - step: 5
      action: "卖家委员会临时会议"
      verify:
        - "72h 内召开"
        - "整改方案 21 票通过 ≥14 票"

    - step: 6
      action: "1 周后追踪指标恢复"
      verify:
        - "响应率回升"
        - "退会员请求归 0"
